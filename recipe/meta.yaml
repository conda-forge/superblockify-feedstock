{% set name = "superblockify" %}
{% set version = "1.0.3" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/superblockify-{{ version }}.tar.gz
  sha256: 9cc72894e0c8ed7dc7a67c13672867e16c904668cefb20df4de49ca0ce72815d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - pip
  run:
    - python >={{ python_min }}
    - osmnx >=2.1.0
    - geopandas
    - rasterio
    - shapely
    - numba
    - scipy
    - tqdm
    - contextily
    - ruamel.yaml
    - seaborn
    - psutil
    - typing_extensions

test:
  imports:
    - superblockify
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://superblockify.city/
  summary: Automated Generation, Visualization, and Analysis of potential Superblocks in Cities
  license: AGPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://superblockify.city/
  dev_url: https://github.com/BikeNetKit/superblockify

extra:
  recipe-maintainers:
    - cbueth
